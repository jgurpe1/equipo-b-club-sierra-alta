<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Únete · Club Sierra Alta</title>
  <link rel="stylesheet" href="css/unete.css">
</head>

<body>

  <header>
    <nav id="nav">
      <div id="tituloLink">
        <a href="index.html"><b>Club Sierra Alta</b></a>
      </div>
      <div>
        <button id="btnModo">Tema oscuro</button>
      </div>
      <div id="navegacionDerecha">
        <a href="index.html">Inicio</a>
        <a href="rutas.html">Rutas</a>
        <a href="unete.html" id="paginaActual">Únete</a>
        <a href="material.html">Material</a>
      </div>
    </nav>
  </header>

    <main class="container">
        <h1>Únete a una salida</h1>
        <form id="formulario" novalidate>
            <label for="nombre">Nombre</label><br>
            <input id="nombre" type="text"><br>
            <span class="error" id="e-nombre"></span>
            <label for="email">Correo electrónico</label><br>
            <input id="email" type="email">
            <span class="error" id="e-email"></span><br>

            <label for="ruta">Ruta</label><br>
            <select id="ruta">
                <option id="senda-rio" value="senda-rio" selected>Senda del río (<span class="precio">5</span>€)</option>
                <option id="collado" value="collado">Collado del lobo (<span class="precio">8</span>€)</option>
                <option id="pico-alto" value="pico-alto">Pico Alto (<span class="precio">12</span>€)</option>
                <option id="hayedo" value="hayedo">Hayedo de otoño (<span class="precio">6</span>€)</option>
                <option id="cresta-aguilas" value="cresta-aguilas">Cresta de las Águilas (<span class="precio">12</span>€)</option>
                <option id="valle" value="valle">Valle de las Fuentes (<span class="precio">8</span>€)</option>
            </select>
            <p id="plazas">Plazas disponibles: 0</p>

            <label for="personas">Número de personas</label><br>
            <input id="personas" type="number" min="1" max="6" value="1">
            <span class="error" id="e-personas"></span>

            <p id="total">Total: 0 €</p>
            <button type="submit" id="btnApuntarme">Apuntarme</button>
            <p id="exito" hidden></p>
        </form>
    </main>

    <footer>
      <p id="textoFooter">© <span id="year">0</span> Club Sierra Alta</p>
    </footer>

  <script src="js/unete.js"></script>
  <script src="js/claroOscuro.js"></script>
</body>

</html>
